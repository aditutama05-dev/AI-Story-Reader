services:
  - type: web
    name: novelith-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: AI_PROVIDER
        value: openrouter
      - key: AI_MODEL
        value: openai/gpt-4o-mini
      - key: AI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: CORS_ORIGINS
        value: https://aditutama05-dev.github.io
