services:
  - type: web
    name: ai-story-reader
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: AI_PROVIDER
        value: openrouter
      - key: AI_MODEL
        value: openai/gpt-4o-mini
      - key: AI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: CORS_ORIGINS
        value: https://aditutama05-dev.github.io
      - key: AI_API_KEY
        sync: false
      - key: APP_ACCESS_TOKEN
        sync: false
