services:
  - type: web
    name: ai-story-reader
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: AI_PROVIDER
        value: openrouter
      - key: AI_MODEL
        value: openai/gpt-4o-mini
      - key: AI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: AI_API_KEY
        sync: false
